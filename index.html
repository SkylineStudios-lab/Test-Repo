<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoop Legends 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.7); font-size: 16px; pointer-events: none; }
    </style>
    <!-- Include Three.js for 3D Graphics and Cannon.js for Real Physics -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    <div id="instructions">Click, drag backward, and release to shoot!</div>

    <script>
        let scene, camera, renderer, world;
        let ballMesh, ballBody;
        let score = 0;
        let isDragging = false;
        let startPoint = { x: 0, y: 0 };

        // 1. Initialize the 3D Engine & Real-Life Physics
        function init() {
            // Setup Visual Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 12);
            camera.lookAt(0, 4, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Setup Real-Life Physics World
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0); // Real Earth Gravity

            addLighting();
            createCourt();
            createHoop();
            spawnBasketball();
            setupInput();

            animate();
        }

        // 2. Add Realistic Studio Lighting & Shadows
        function addLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const spotlight = new THREE.DirectionalLight(0xffffff, 0.8);
            spotlight.position.set(5, 20, 10);
            spotlight.castShadow = true;
            spotlight.shadow.mapSize.width = 1024;
            spotlight.shadow.mapSize.height = 1024;
            scene.add(spotlight);
        }

        // 3. Create the Wooden Gym Floor
        function createCourt() {
            // Three.js Visual Court (Orange-brown wood look)
            const floorGeo = new THREE.PlaneGeometry(30, 40);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.3 });
            const floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Cannon.js Invisible Physics Ground
            const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);
        }

        // 4. Create the Basketball Hoop and Backboard
        function createHoop() {
            const hoopGroup = new THREE.Group();

            // Backboard
            const backboardGeo = new THREE.BoxGeometry(4, 2.5, 0.1);
            const backboardMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
            const backboard = new THREE.Mesh(backboardGeo, backboardMat);
            backboard.position.set(0, 6.5, -6);
            hoopGroup.add(backboard);

            // The Rim (The Ring)
            const rimGeo = new THREE.TorusGeometry(0.8, 0.05, 16, 100);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xff4500 }); // Neon Orange
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.set(0, 5.3, -5);
            hoopGroup.add(rim);

            scene.add(hoopGroup);

            // Invisible Physics Box for detecting a successful basket
            const backboardBody = new CANNON.Body({
                mass: 0,
                position: new CANNON.Vec3(0, 6.5, -6),
                shape: new CANNON.Box(new CANNON.Vec3(2, 1.25, 0.05))
            });
            world.addBody(backboardBody);
        }

        // 5. Spawn the Physics-Enabled Basketball
        function spawnBasketball() {
            // Visual Ball Mesh (Classic textured leather orange)
            const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xd2691e, roughness: 0.6, metalness: 0.1 });
            ballMesh = new THREE.Mesh(ballGeo, ballMat);
            ballMesh.castShadow = true;
            scene.add(ballMesh);

            // Physics Ball Body (Gives it weight and real bounce attributes)
            ballBody = new CANNON.Body({
                mass: 0.6, // Weight of a real basketball in kg
                shape: new CANNON.Sphere(0.5),
                position: new CANNON.Vec3(0, 2, 8) // Spawns directly in front of camera
            });
            
            // Make the ball bouncy
            ballBody.linearDamping = 0.1;
            ballBody.angularDamping = 0.1;
            world.addBody(ballBody);
        }

        // 6. Handle Slingshot Input Mechanics
        function setupInput() {
            window.addEventListener('mousedown', (e) => {
                isDragging = true;
                startPoint.x = e.clientX;
                startPoint.y = e.clientY;
            });

            window.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;

                // Calculate total drag distance across the screen
                const dragX = e.clientX - startPoint.x;
                const dragY = e.clientY - startPoint.y;

                // Only shoot if they dragged backwards/downwards
                if (dragY > 20) {
                    shootBall(dragX, dragY);
                }
            });
        }

        // 7. Calculate and Apply 3D Impulse Forces
        function shootBall(dragX, dragY) {
            // Reset position to the shot line
            ballBody.position.set(0, 2, 8);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);

            // Turn screen pixels into exact 3D physics forces
            const forceX = -dragX * 0.03;  // Side-to-side aim adjustment
            const forceY = dragY * 0.06;   // Height arc
            const forceZ = -dragY * 0.07;  // Depth (Propels ball downcourt toward the rim)

            // Punch the physical object forward
            ballBody.applyImpulse(new CANNON.Vec3(forceX, forceY, forceZ), ballBody.position);

            // Basic automated scoring calculation (runs 1.5 seconds post-shot)
            setTimeout(() => {
                // Checks if the ball is currently directly inside the hoop layout region
                if (ballBody.position.z > -5.8 && ballBody.position.z < -4.2 && 
                    ballBody.position.x > -1 && ballBody.position.x < 1 &&
                    ballBody.position.y > 4.8 && ballBody.position.y < 5.8) {
                    score++;
                    document.getElementById('score').innerText = score;
                }
            }, 1500);
        }

        // 8. Core Animation Render Loop
        function animate() {
            requestAnimationFrame(animate);

            // Step the real-world physics time frame forward
            world.step(1 / 60);

            // Copy physical movements directly onto the visible 3D models
            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
